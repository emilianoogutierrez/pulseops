name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pulseops:pulseops@127.0.0.1:5432/pulseops?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:public
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pulseops
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseops -d pulseops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pulseops:pulseops@localhost:5432/pulseops?schema=public
      PULSEOPS_DEMO_MODE: "true"
      DEMO_PASSWORD: pulseops-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npm run db:push
      - run: npm run db:seed:demo
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pulseops
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseops -d pulseops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pulseops:pulseops@localhost:5432/pulseops?schema=public
      PULSEOPS_DEMO_MODE: "true"
      DEMO_PASSWORD: pulseops-demo-password
      SESSION_COOKIE_NAME: pulseops_session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npm run db:push
      - run: npm run db:seed:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium
